name: Update Market Regime Dashboard

on:
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-regime-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ".github/actions-requirements.txt"

      - name: Install dependencies
        run: python -m pip install -r .github/actions-requirements.txt

      - name: Run Automatic Publish
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_market_regime_dashboard.py --commit --push
